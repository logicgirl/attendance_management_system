# Runs PostgreSQL and the API together: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: attendease
      POSTGRES_PASSWORD: attendease
      POSTGRES_DB: attendease
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendease"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://attendease:attendease@db:5432/attendease
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
