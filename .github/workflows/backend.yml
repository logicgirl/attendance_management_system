name: Backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migrations
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Create databases
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres migrations
          PGPASSWORD=postgres createdb -h localhost -U postgres tests

      - name: Migrations apply, match the models, and roll back
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Tests (PostgreSQL)
        run: pytest -q
